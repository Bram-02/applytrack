services:
  db:
    image: postgres:16-alpine
    container_name: applytrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack # local development only
      POSTGRES_DB: applytrack
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack -d applytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    container_name: applytrack-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://applytrack:applytrack@db:5432/applytrack?schema=public
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
