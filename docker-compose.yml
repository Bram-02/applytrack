services:
  db:
    image: postgres:16-alpine
    container_name: applytrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: applytrack
      POSTGRES_PASSWORD: applytrack # local development only
      POSTGRES_DB: applytrack
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrack -d applytrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
